name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, zip, fileinfo
          tools: phpunit:${{ matrix.php < '8.2' && '9.6' || '11' }}
          coverage: none

      - name: Lint
        run: php -l index.php && php -l themes/sky/theme.php

      - name: the VERSION line has the exact shape the updater parses
        run: grep -Eq "^define\('VERSION', '[0-9]+\.[0-9]+\.[0-9]+'\);$" index.php
      - name: version file must equal the VERSION constant
        run: |
          FILE=$(tr -d '[:space:]' < version)
          CODE=$(grep -oE "define\('VERSION', '[0-9]+\.[0-9]+\.[0-9]+'\)" index.php | grep -oE "[0-9]+\.[0-9]+\.[0-9]+")
          echo "version file: $FILE, VERSION constant: $CODE"
          test "$FILE" = "$CODE"

      - name: Fresh install boots without warnings
        run: |
          rm -rf /tmp/site && mkdir /tmp/site && cp index.php .htaccess /tmp/site/ && cp -r themes /tmp/site/
          cd /tmp/site
          php -d display_errors=1 -d error_reporting=-1 -S 127.0.0.1:8080 >/tmp/server.log 2>&1 &
          sleep 2
          BODY=$(curl -s http://127.0.0.1:8080/)
          echo "$BODY" | grep -q "<html" || { echo "no HTML"; cat /tmp/server.log; exit 1; }
          if echo "$BODY" | grep -qiE "Warning:|Deprecated:|Notice:|Fatal error"; then echo "$BODY" | grep -iE "Warning:|Deprecated:|Notice:|Fatal error"; exit 1; fi
          grep -iE "Warning|Deprecated|Fatal" /tmp/server.log && exit 1 || echo "clean boot"

      - name: Fresh install boots with the disable-able functions disabled
        # Hardened shared hosts put these in disable_functions. The updater guards its own set; this checks the boot path (round 14: flock; round 15: the ob_* set). is_writable() is not in the list: 3.6.0 needs it at boot too.
        run: |
          rm -rf /tmp/site2 && mkdir /tmp/site2 && cp index.php .htaccess /tmp/site2/ && cp -r themes /tmp/site2/
          cd /tmp/site2
          php -d display_errors=1 -d error_reporting=-1 -d disable_functions=flock,fopen,stream_get_contents,fclose,ob_start,ob_get_level,ob_end_clean,ob_end_flush,chmod,rename,unlink,fileowner,filegroup,fileperms,getmypid,exec,shell_exec,system,passthru,proc_open,popen -S 127.0.0.1:8081 >/tmp/server2.log 2>&1 &
          sleep 2
          BODY=$(curl -s http://127.0.0.1:8081/)
          echo "$BODY" | grep -q "<html" || { echo "no HTML with functions disabled"; cat /tmp/server2.log; exit 1; }
          if echo "$BODY" | grep -qiE "Warning:|Deprecated:|Notice:|Fatal error"; then echo "$BODY" | grep -iE "Warning:|Deprecated:|Notice:|Fatal error"; exit 1; fi
          grep -iE "Warning|Deprecated|Fatal" /tmp/server2.log && exit 1 || echo "clean boot with functions disabled"

      - name: A login saves through the rename path with getmypid and the other non-file hardening functions disabled
        # The step above disables rename(), so every save there is the direct write; here the file functions stay and the login's save renames a temp file into place.
        run: |
          rm -rf /tmp/site3 && mkdir /tmp/site3 && cp index.php .htaccess /tmp/site3/ && cp -r themes /tmp/site3/
          cd /tmp/site3
          php -d display_errors=1 -d error_reporting=-1 -d disable_functions=getmypid,flock,fopen,stream_get_contents,fclose,ob_start,ob_get_level,ob_end_clean,ob_end_flush,exec,shell_exec,system,passthru,proc_open,popen -S 127.0.0.1:8082 >/tmp/server3.log 2>&1 &
          sleep 2
          PW=$(curl -s -c /tmp/jar3 -b /tmp/jar3 http://127.0.0.1:8082/ | grep -o 'everything is: <b>[^<]*' | sed 's/.*<b>//')
          test -n "$PW" || { echo "no install password on the first page"; cat /tmp/server3.log; exit 1; }
          BEFORE=$(cksum < data/database.js)
          curl -s -c /tmp/jar3 -b /tmp/jar3 -o /dev/null -X POST -d "password=$PW" "http://127.0.0.1:8082/?page=loginURL"
          curl -s -c /tmp/jar3 -b /tmp/jar3 http://127.0.0.1:8082/ | grep -q 'id="settingsModal"' || { echo "login did not land"; cat /tmp/server3.log; exit 1; }
          test "$(cksum < data/database.js)" != "$BEFORE" || { echo "the login saved nothing"; exit 1; }
          if ls data/database.js.*.tmp 2>/dev/null; then echo "temp file left"; exit 1; fi
          grep -iE "Warning|Deprecated|Fatal" /tmp/server3.log && exit 1 || echo "login saved through the rename path with getmypid disabled"

      - name: PHPUnit
        run: phpunit --no-coverage

      - name: A change to index.php on a PR into main must bump VERSION
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          git fetch origin main --depth=1
          if git diff --quiet origin/main -- index.php; then echo "index.php unchanged"; exit 0; fi
          BASE=$(git show origin/main:version | tr -d '[:space:]')
          HEAD=$(tr -d '[:space:]' < version)
          echo "main: $BASE, this branch: $HEAD"
          php -r 'exit(version_compare($argv[1], $argv[2], ">") ? 0 : 1);' "$HEAD" "$BASE"

  no-fileinfo:
    name: Upload without fileinfo (#356)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring, zip, :fileinfo
          tools: phpunit:11
          coverage: none
      - name: fileinfo really is absent
        run: "php -r 'exit((int) extension_loaded(\"fileinfo\"));'"
      - name: PHPUnit (the no-fileinfo test runs for real here, skips elsewhere)
        run: phpunit --no-coverage --filter testUploadIsAcceptedByExtensionWhenMimeDetectionIsUnavailable

      - name: Updater as another user than the file owner writes in place and keeps the owner
        run: |
          SITE=$(mktemp -d) && cp index.php "$SITE/" && chmod 777 "$SITE" && chmod 666 "$SITE/index.php"
          sudo chgrp nogroup "$SITE/index.php"  # same group as nobody's temp file: only the owner half of the condition can route this in place
          sed "s/define('VERSION', '\([0-9.]*\)');/define('VERSION', '99.0.0');/" index.php > /tmp/newcore.php
          sudo -u nobody "$(command -v php)" tests/probe.php update-run "$SITE" /tmp/newcore.php > /tmp/probe.json; cat /tmp/probe.json; echo
          test "$(sha256sum "$SITE/index.php" | cut -d' ' -f1)" = "$(sha256sum /tmp/newcore.php | cut -d' ' -f1)"
          test "$(stat -c %U "$SITE/index.php")" = "$(id -un)"
          test ! -e "$SITE/index.php.tmp"

      - name: Updater on a disk with no free inode or block refuses and leaves index.php whole
        run: |
          # A real ENOSPC, the shape the atomic write exists for: a tmpfs with room for the site and nothing else.
          SITE=$(mktemp -d) && sudo mount -t tmpfs -o size=1m,nr_inodes=12,mode=0777 tmpfs "$SITE"
          cp index.php "$SITE/" && BEFORE=$(sha256sum "$SITE/index.php" | cut -d' ' -f1)
          head -c 20 index.php > /tmp/truncated.php && php tests/probe.php update-run "$SITE" /tmp/truncated.php > /dev/null  # a first run creates data/, themes/, plugins/ and the database, as the PHPUnit steps do
          i=0; while touch "$SITE/filler$i" 2>/dev/null; do i=$((i+1)); done; echo "fillers: $i"   # use up every remaining inode
          DBBEFORE=$(sha256sum "$SITE/data/database.js" | cut -d' ' -f1)
          php tests/probe.php update-run "$SITE" /tmp/newcore.php > /tmp/probe.json; cat /tmp/probe.json; echo
          test "$(sha256sum "$SITE/data/database.js" | cut -d' ' -f1)" = "$DBBEFORE"
          test "$(sha256sum "$SITE/index.php" | cut -d' ' -f1)" = "$BEFORE"   # untouched: no temp could be created, so nothing is written (3.6.0's in-place write would have succeeded here; an in-place write on a disk also out of blocks truncates)
          test -z "$(ls "$SITE" | grep '\.tmp$')"
          grep -q 'Could not write the new index.php' /tmp/probe.json
          grep -q '"success"' /tmp/probe.json && exit 1 || true
          # the same site with the blocks exhausted instead of the inodes
          sudo umount "$SITE" && sudo mount -t tmpfs -o size=192k,nr_inodes=100,mode=0777 tmpfs "$SITE"
          cp index.php "$SITE/" && php tests/probe.php update-run "$SITE" /tmp/truncated.php > /dev/null
          php tests/probe.php update-run "$SITE" /tmp/newcore.php > /tmp/probe.json; cat /tmp/probe.json; echo
          test "$(sha256sum "$SITE/index.php" | cut -d' ' -f1)" = "$BEFORE"   # untouched, not truncated (with no block free 3.6.0 left 0 bytes; with fewer than one core free it overwrote in place, so here 3.7.0 refuses where 3.6.0 succeeded)
          test ! -e "$SITE/index.php.tmp"
          grep -q '"success"' /tmp/probe.json && exit 1 || true
          sudo umount "$SITE"

  no-tokenizer:
    name: Suite without token_get_all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring, zip, fileinfo
          ini-values: disable_functions=token_get_all  # php.ini, so the probe subprocesses run without it too
          tools: phpunit:11
          coverage: none
      - name: token_get_all really is disabled
        run: "php -r 'exit((int) function_exists(\"token_get_all\"));'"
      - name: PHPUnit (the updater validates a new core structurally here)
        run: phpunit --no-coverage

  windows-url:
    name: url() on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring, zip
          tools: phpunit:11
          coverage: none
      # url() shapes, and the updater's temp-file + rename write (rename over an existing file differs on Windows).
      # Two lines: the phpunit .bat shim re-parses a "|" in the filter as a pipe.
      - run: phpunit --no-coverage --filter PagesAndUrlTest
      - run: phpunit --no-coverage --filter UpdateGuardTest
      # save() renames database.js into place; with another process holding the file open Windows may refuse the rename and take the locked in-place write.
      - run: phpunit --no-coverage --filter DatabaseLockTest
      # 'sky.' is the sky folder only on Windows: the delete guard's trailing-dot branch and its Sky sentence run here only.
      - run: phpunit --no-coverage --filter testTrailingDotsAndSpacesOnTheSkyName
      # themes/Sky is the sky folder here (no Remove button either way), and the Files tab listing and sort on NTFS.
      - run: phpunit --no-coverage --filter LocalModulesTest
